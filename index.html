<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar App | Automated with GitHub Actions</title>
    <!-- Modern Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --bg: #0f172a;
            --text: #f8fafc;
        }
        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* Premium dark gradient background */
            background: radial-gradient(circle at 10% 20%, rgb(35, 25, 60) 0%, rgb(15, 23, 42) 90%);
        }
        .container {
            text-align: center;
            padding: 4rem;
            /* Glassmorphism effect */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            font-weight: 800;
            /* Gradient text */
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }
        p {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stellar Actions</h1>
        <p id="description">This beautiful landing page is automatically tested and deployed to GitHub Pages using a fully automated CI/CD pipeline!</p>
        <a href="https://github.com/features/actions" target="_blank" class="btn">Explore GitHub Actions</a>
    </div>
</body>
</html>
